[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/partners"
  to = "/sponsors/"
  status = 301

[[redirects]]
  from = "/partners/*"
  to = "/sponsors/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
